name: deploy

# Stage then promote on the VM, as the product user `overwatch`
# (/home/overwatch/projects/overwatch). The VM holds a real git checkout, so a
# deploy is `git pull` + the existing scripts — no rsync from a runner.
#
# Promotion is a separate job behind the `production` GitHub Environment: add a
# required reviewer there and going live stays a human decision (RULES.md rule
# 17 — done means promoted AND verified).
# Sequenced AFTER the sandbox rebuild: sandbox is where a change is validated
# before production is touched. Chaining on workflow_run (instead of firing both
# on the same push) means the sandbox is already carrying the commit by the time
# the production candidate is built, and `promote` still waits for the founder's
# approval — so nothing reaches production unvalidated.
on:
  workflow_run:
    workflows: ["sandbox (per PR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # A chained run whose sandbox rebuild did NOT succeed will skip (see the job
  # `if` below) — but concurrency is evaluated BEFORE that `if`, so it would
  # still join this group, cancel the deploy actually in flight, and only then
  # skip. Net effect: nothing reaches production and nothing reports a failure
  # (#263). Give a doomed run its own throwaway group so it cancels nothing;
  # real deploys still serialise on deploy-production.
  group: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success')
             && format('deploy-skip-{0}', github.run_id) || 'deploy-production' }}
  # Never two deploys at once — a newer push supersedes the older run (latest
  # main wins). cancel-in-progress MUST be true: `promote` waits on the
  # `production` environment reviewer, and with `false` a single un-actioned
  # approval sits in `waiting` holding this group forever, so every later run
  # queues as pending with 0 jobs and the pipeline wedges (#203). Cancelling the
  # stale run instead keeps staging flowing and re-stages the latest commit.
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    # A failed sandbox rebuild means the commit is not validated anywhere —
    # don't build a production candidate from it. Manual dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Authorize the SSH session
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Gate and build the candidate colour
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TARGET" \
            "SHA='$SHA' RUN_ID='$RUN_ID' RUN_URL='$RUN_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/projects/overwatch
          git fetch -q origin
          git checkout -qf "$SHA"   # -f: survive files left by an rsync-era deploy
          printf 'OVERWATCH_VERSION=%s\n' "$(tr -d '[:space:]' < VERSION)" > orbit-poc/version.env
          # core singletons: created only if absent, never recreated here
          cd orbit-poc && podman-compose up -d --no-recreate db ingest grafana \
            otel-collector prometheus caddy >/dev/null
          for c in $(podman ps --format '{{.Names}}' | grep ^orbit-poc); do
            podman update --restart=always "$c" >/dev/null; done
          # Provisioned dashboards live in a read-only mount, and grafana is
          # started with --no-recreate, so an edited board would otherwise sit
          # in the repo and never reach production. Ask Grafana to re-read them
          # (no restart, no downtime for the embeds).
          podman exec orbit-poc_grafana_1 sh -c \
            'wget -qO- --post-data="" \
             "http://admin:$GF_SECURITY_ADMIN_PASSWORD@localhost:3000/api/admin/provisioning/dashboards/reload"' \
            >/dev/null 2>&1 || echo "grafana dashboard reload skipped (not reachable)"
          # The ingest needs the same treatment as the sandbox (#237): `up -d
          # --build` BUILDS a new image but reuses the one already pinned in
          # the existing container, so the ingest silently kept running old
          # code — 41 hours' worth, including the decoder fix (#171) and the
          # polite TLE client (#304), while every check stayed green. Build,
          # remove, recreate, then ASSERT the running image is the built one.
          # The ingest serves no traffic, so removing it costs nothing visible.
          # The SatNOGS gateway (#449) gets the same treatment, and in
          # dependency order: the ingest depends_on the gateway, so the ingest
          # goes first on removal and last on recreate. Until #450 the gateway
          # was never rebuilt here at all, so a merged gateway change stayed
          # in the repo while production ran the hand-built image.
          # statusmon (#470) is code too and was never started by this step
          # until #480: a service that is not named here does not exist on
          # prod, whatever the compose file says.
          podman-compose build satnogs-gateway ingest statusmon 2>&1 | tail -1
          podman rm -f orbit-poc_ingest_1 >/dev/null 2>&1 || true
          podman rm -f orbit-poc_satnogs-gateway_1 >/dev/null 2>&1 || true
          podman rm -f orbit-poc_statusmon_1 >/dev/null 2>&1 || true
          podman-compose up -d --no-deps satnogs-gateway 2>&1 | tail -1
          podman-compose up -d --no-deps ingest 2>&1 | tail -1
          podman-compose up -d --no-deps statusmon 2>&1 | tail -1
          for svc in satnogs-gateway ingest statusmon; do
            want=$(podman image inspect "localhost/orbit-poc_${svc}:latest" \
                   --format '{{.Id}}' 2>/dev/null || true)
            got=$(podman inspect "orbit-poc_${svc}_1" --format '{{.Image}}' 2>/dev/null || true)
            if [ -n "$want" ] && [ "$want" != "$got" ]; then
              echo "STALE $svc: running ${got:0:12}, freshly built ${want:0:12}" >&2
              exit 1
            fi
          done
          echo "gateway + ingest + statusmon running the freshly built images"
          # The public YAMCS demo (#436). It used to be a compose project run by
          # hand out of a scratch directory, and it went silent for 16 days with
          # both containers Up and nobody noticing (#428). Rule 33: if it is
          # versioned source, compose and CI own it. Its own project name, not
          # the core one: the YAMCS image is a heavy Maven build with a lifecycle
          # of its own, and a demo must never be able to delay prod.
          #   The tenant key lives in that directory's .env on the VM, never in
          # git; no .env means no demo, which is also the self-host default.
          DEMO=~/projects/overwatch/orbit-poc/bridge/yamcs/demo
          if [ -f "$DEMO/.env" ]; then
            D="podman-compose -p ow-demo -f docker-compose.yml -f docker-compose.internal.yml"
            ( cd "$DEMO"
              # build both: the pinned quickstart layers are cached, so after
              # the first deploy this only rebuilds the bridge when it changed
              $D build 2>&1 | tail -2
              # remove the bridge so `up` re-resolves its tag (#119): a recreate
              # alone reuses the image id already pinned in the container
              podman rm -f ow-demo_bridge_1 >/dev/null 2>&1 || true
              $D up -d 2>&1 | tail -2 )
            for c in ow-demo_yamcs_1 ow-demo_bridge_1; do
              podman inspect "$c" --format "{{.Name}} {{.State.Status}}" 2>/dev/null \
                || { echo "the YAMCS demo did not come up: $c missing" >&2; exit 1; }
            done
            # Freshness is statusmon's job (yamcs demo (data age), #436), not a
            # one-shot check here: the containers being up is exactly what was
            # true for the whole 16 days it was silent.
          else
            echo "no $DEMO/.env - skipping the YAMCS demo"
          fi
          cd ~/projects/overwatch
          bash deploy/run-tests.sh          # the gate: no candidate on a red suite
          bash deploy/slots.sh stage
          # staging is its own stack on its own database since #154, built from
          # THIS commit — the exact binary that the candidate colour carries.
          cd orbit-poc/staging
          podman-compose -p ovw-staging -f docker-compose.yml down 2>/dev/null || true
          podman-compose -p ovw-staging -f docker-compose.yml up -d --build 2>&1 | tail -2
          for c in $(podman ps --format '{{.Names}}' | grep ^ovw-staging); do
            podman update --restart=always "$c" >/dev/null; done
          # Realm configuration is code (#174/#201): re-converge it on every
          # stage, so a merged realm-file change can no longer sit unapplied
          # waiting for a by-hand one-shot (#265 found eventsEnabled would
          # have). One shared Keycloak serves all envs, so realm files are
          # per-environment and a prod-realm edit lands at stage time - keep
          # prod realm edits deliberate. The cli is partial + no-delete +
          # idempotent; a failed apply fails the stage, loudly. This is also
          # where the internal gate realm lands (#290): overwatch-gate.json is
          # owned end to end by the cli, so the gate's clients, role and passkey
          # flow are never a by-hand click either.
          cd ~/projects/overwatch/orbit-poc/v2
          # DETACHED, then wait on the one container we care about. An attached
          # `up` is not safe here: podman-compose 1.3.0 ignores --no-deps when a
          # dependency has to be started and runs `podman start -a` on kc-db and
          # keycloak, which never exit — the step then hangs until the job
          # timeout with the apply already finished. Seen on 2026-09-25: the
          # cli exited 0 at 20:01 and the stage was still attached at 21:54.
          podman-compose -p ovw2 up -d --no-deps keycloak-config-cli 2>&1 | tail -3
          timeout 300 podman wait ovw2_keycloak-config-cli_1 >/dev/null || {
            echo "realm config apply did not finish in 5 minutes" >&2
            podman logs --tail 20 ovw2_keycloak-config-cli_1 >&2 || true
            exit 1; }
          rc=$(podman inspect ovw2_keycloak-config-cli_1 --format '{{.State.ExitCode}}')
          [ "$rc" = "0" ] || {
            echo "realm config apply failed (exit $rc)" >&2
            podman logs --tail 30 ovw2_keycloak-config-cli_1 >&2 || true
            exit 1; }
          # The ops Grafana shows what is staged vs promoted (#382); this row
          # is where "the gap" starts ticking.
          bash ~/projects/overwatch/deploy/record-deploy-event.sh \
            stage "$SHA" "$RUN_ID" "$RUN_URL"
          REMOTE

      - name: Check staging answers (its own stack, its own database)
        run: |
          # /v1/healthz is open at the internal gate (#290) on purpose, so this
          # asks about the stack rather than about the gate.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            https://staging.overwatch.confinia.io/api/v1/healthz)
          echo "staging healthz -> $code"
          [ "$code" = "200" ]
          # And the gate really is in front: no session, no page.
          redir=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
            --max-time 20 https://staging.overwatch.confinia.io/ || true)
          echo "staging / -> $redir"
          case "$redir" in
            30[1237]*/oauth2/sign_in*|30[1237]*/oauth2/start*) ;;
            *) echo "the gate is not in front of staging: $redir" >&2; exit 1 ;;
          esac

  promote:
    needs: stage
    runs-on: ubuntu-latest
    environment: production     # add a required reviewer here to gate go-live
    steps:
      - name: Authorize the SSH session
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Swap the live colour
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TARGET" \
            'bash ~/projects/overwatch/deploy/slots.sh promote'
          # the promote row closes "the gap" on the ops deploys board (#382)
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TARGET" \
            "bash ~/projects/overwatch/deploy/record-deploy-event.sh \
             promote '$SHA' '$RUN_ID' '$RUN_URL'"

      - name: Verify production is live
        run: |
          set -e
          for url in \
            https://overwatch.confinia.io/ \
            https://api.overwatch.confinia.io/v1/satellites \
            https://overwatch.confinia.io/grafana/api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ]
          done
          # the isolation invariant (#129): anonymous SQL must not reach private data
          body=$(curl -s --max-time 20 -X POST \
            https://overwatch.confinia.io/grafana/api/ds/query \
            -H 'content-type: application/json' \
            -d '{"queries":[{"refId":"A","datasource":{"uid":"orbitcache","type":"postgres"},"rawSql":"select count(*) from tenant_telemetry","format":"table"}]}')
          echo "$body" | grep -q "permission denied" \
            && echo "private data still denied to anonymous callers" \
            || { echo "SECURITY REGRESSION: private table readable"; exit 1; }

  # A skipped deploy is invisible. `stage` is gated on the sandbox run having
  # concluded 'success', so a cancelled or failed sandbox leaves this whole
  # workflow skipped: no red check, no notification, nothing retries — while
  # the change sits merged and green and production quietly runs older code.
  # That is how #320 stayed undeployed until it was dispatched by hand (#325).
  #
  # This job exists to make that state loud. It fires only when the chain was
  # broken, and fails only when the break actually stalls something: if main
  # has already moved past the stalled commit, a newer chain is coming and a
  # failure here would be pure noise.
  #
  # Note it cannot cancel a real deploy: a non-success workflow_run is given a
  # throwaway concurrency group above, precisely so a doomed run cancels
  # nothing.
  chain-broken:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report a production deploy that will never happen
        env:
          GH_TOKEN: ${{ github.token }}
          STALLED: ${{ github.event.workflow_run.head_sha }}
          WHY: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" != "$STALLED" ]; then
            echo "sandbox run for ${STALLED:0:7} concluded '$WHY', but main is"
            echo "now at ${tip:0:7} — a newer chain will carry it. Nothing to do."
            exit 0
          fi
          echo "::error title=Production not deployed::The sandbox run for \
          ${STALLED:0:7} concluded '$WHY', so this deploy skipped — and \
          ${STALLED:0:7} is still main's tip, so no further chain is coming. \
          Production is running older code than main. Re-run with: \
          gh workflow run deploy.yml --ref main"
          exit 1
