name: sandbox (per PR)

# Every commit on a pull request redeploys https://sandbox.overwatch.confinia.io
# so the change can be validated live before merge. Also runs on main, so the
# sandbox never lags behind what is deployed.
#
# It builds from a DEDICATED checkout (~/sandbox-src/overwatch), never from
# ~/projects/overwatch: that tree is production's, owned by deploy.yml, and
# checking a PR commit into it would both race that workflow and leave the
# production source pointing at unmerged code (#147 was the same class of bug).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # There is ONE sandbox, so the group stays constant and every ref serialises
  # on it — that is deliberate: two walkers racing created organizations in the
  # same Keycloak realm and failed each other with an opaque 400.
  #
  # What must NOT be constant is who gets to cancel. With a plain `true`, a run
  # from ANY branch cancelled whatever was in flight — so opening a pull request
  # killed main's sandbox run, and deploy.yml (chained on this workflow
  # concluding 'success') then SKIPPED. A skip is not a failure: nothing goes
  # red, nothing retries, and a merged, green change silently never reaches
  # production. #320 sat undeployed that way until it was dispatched by hand,
  # and #324 needed the next chain to carry it (#325).
  #
  # So: only main may cancel. A push to main supersedes whatever is running and
  # keeps its own deploy chain intact; a pull-request run waits its turn instead
  # of taking production's chain down with it. GitHub keeps only the newest
  # pending run per group, so PR runs still coalesce rather than pile up.
  group: sandbox-deploy
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull requests from forks receive no secrets, so the SSH key would be
    # empty and the job would fail on an unrelated error. Skip it plainly.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Authorize the SSH session
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rebuild the sandbox at this commit
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TARGET" \
            "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          SRC=~/sandbox-src/overwatch
          if [ ! -d "$SRC/.git" ]; then
            mkdir -p ~/sandbox-src
            git clone -q https://github.com/confinia/overwatch.git "$SRC"
          fi
          cd "$SRC"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' \
                             '+refs/pull/*/head:refs/remotes/origin/pr/*'
          git checkout -qf "$SHA"
          # secrets live with the stack, never in git
          cp ~/projects/overwatch/orbit-poc/sandbox/.env orbit-poc/sandbox/.env
          chmod 600 orbit-poc/sandbox/.env
          # NOTE: a PR never reconciles Keycloak. The gate realm (#290) is
          # applied by deploy.yml at stage time, from main, together with the
          # application realms. Two reasons, both learned the hard way: an
          # unmerged branch must not be able to edit live prod auth, and
          # `podman-compose up keycloak-config-cli` run from ANY directory but
          # ~/projects/overwatch/orbit-poc/v2 recreates the shared Keycloak
          # container, taking every environment's login down while it boots.
          # The gate itself needs no realm to redirect a visitor to one, so the
          # check below is honest either way.
          cd orbit-poc/sandbox
          # #237: never `down` first. The long part of a redeploy is the BUILD
          # (2-4 min); with the stack torn down, that whole window answers a
          # bare 502 — to a visitor's browser and to our own e2e walks alike.
          # Build while the OLD stack keeps serving, then swap in seconds.
          C="podman-compose -p ovw-sandbox -f docker-compose.yml"
          $C build 2>&1 | tail -3
          # `up` alone collides on existing container names and silently keeps
          # the OLD containers (#119) — so the swap must be explicit. Only the
          # app services: db keeps its data warm, caddy keeps the listener up.
          # `--force-recreate` recreates the CONTAINER but reuses the image id
          # already pinned in it, so a freshly built :latest is ignored and the
          # stack silently keeps serving yesterday's code. Removing the app
          # containers first forces `up` to resolve the tag again. caddy and db
          # are never touched, so the listener stays up (#237).
          # podman-compose 1.3.0 has no `rm` subcommand, so remove the app
          # containers with podman directly — the names are deterministic.
          # ONE AT A TIME, in dependency order: `web` depends_on `api`, and
          # podman rm with several names does not honour the order given, so a
          # single call fails with "has dependent containers".
          for c in web api grafana ingest gate; do
            podman rm -f "ovw-sandbox_${c}_1" >/dev/null 2>&1 || true
          done
          # Only the services just removed, and --no-deps so `up` does not try
          # to recreate db/caddy — it errors on their existing container names
          # rather than skipping them (podman-compose has no --replace).
          $C up -d --no-deps web api grafana ingest gate 2>&1 | tail -2
          # caddy LAST, and recreated rather than reloaded. The Caddyfile is a
          # single-FILE bind mount from this checkout, and `git checkout`
          # replaces the file instead of writing into it — so the container
          # stays bound to the old inode and `caddy reload` answers "config is
          # unchanged" however much the Caddyfile changed. That is not a theory:
          # three consecutive reloads said exactly that while the sandbox served
          # a two-week-old gate config (#290). Recreating costs the listener
          # about a second, and it happens after the app services are already
          # up, so the #237 concern (a 2-4 minute build window answering 502)
          # does not apply.
          podman rm -f ovw-sandbox_caddy_1 >/dev/null 2>&1 || true
          $C up -d --no-deps caddy 2>&1 | tail -2
          podman exec ovw-sandbox_caddy_1 caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -1
          for c in $(podman ps --format '{{.Names}}' | grep ^ovw-sandbox); do
            podman update --restart=always "$c" >/dev/null; done
          # Container age proves the container is new; it does NOT prove the
          # CODE is new — a recreate can reuse the old image and serve stale
          # code with every green check. Assert the running container uses the
          # image we just built.
          for svc in api web; do
            want=$(podman image inspect "localhost/ovw-sandbox_${svc}:latest" --format '{{.Id}}' 2>/dev/null || true)
            got=$(podman inspect "ovw-sandbox_${svc}_1" --format '{{.Image}}' 2>/dev/null || true)
            if [ -n "$want" ] && [ "$want" != "$got" ]; then
              echo "STALE DEPLOY: $svc runs ${got:0:12}, freshly built image is ${want:0:12}" >&2
              exit 1
            fi
          done
          echo "sandbox now runs $SHA (api+web on the freshly built images)"
          REMOTE

      - name: Check it answers
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Two questions, because the gate (#290) makes them different ones.
          # The app: /v1/healthz is open at the gate, so 200 is the stack.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://sandbox.overwatch.confinia.io/api/v1/healthz || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "sandbox healthz -> $code"
          [ "$code" = "200" ]
          # The gate: a session-less visitor is sent to sign in, and nothing
          # else. A 200 here would mean the environment became public.
          redir=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
            --max-time 20 https://sandbox.overwatch.confinia.io/ || true)
          echo "sandbox / -> $redir"
          case "$redir" in
            30[1237]*/oauth2/sign_in*|30[1237]*/oauth2/start*) ;;
            *) echo "the gate is not in front of the sandbox: $redir" >&2; exit 1 ;;
          esac
          echo "### Sandbox updated" >> $GITHUB_STEP_SUMMARY
          echo "https://sandbox.overwatch.confinia.io now runs \`${SHA:0:7}\`" \
            >> $GITHUB_STEP_SUMMARY
