name: e2e (sandbox)

# The full signup -> organization -> private Grafana walk against the live
# sandbox. It runs ON the VM as the product user, because from there Keycloak's
# admin API is reachable at 127.0.0.1:8096 (a container cannot reach a
# loopback-bound port) and the stack's own .env supplies the admin credentials.
#
# The script is shipped from the runner's checkout to a scratch path rather than
# pulled with git on the VM: deploy.yml owns that checkout, and both workflows
# fire on the same push — sharing it made them race on .git/index.lock (#147).
# Runs AFTER the sandbox has redeployed, not on the push itself: pushing to
# main fires "sandbox (per PR)" (which recreates the sandbox stack) and the e2e
# at the same time, so walking on the push races the redeploy and 502s
# mid-flight (#151). Chaining off workflow_run makes the walk see a settled
# sandbox. Manual dispatch still walks whatever is live now.
on:
  workflow_run:
    workflows: ["sandbox (per PR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-sandbox          # one at a time: it creates a real user + org
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Skip when the sandbox redeploy failed — no point walking a broken stack.
    # A manual dispatch has no triggering run, so it always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Authorize the SSH session
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the walker to the VM
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          # scratch path, not the deployment checkout (#147). Not /tmp either:
          # the VM's /tmp is a tmpfs that runs full.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TARGET" 'mkdir -p ~/e2e-run'
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            deploy/e2e_sandbox.py "$TARGET:~/e2e-run/e2e_sandbox.py"

      - name: Walk the paid path end to end
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          BASIC_PASS: ${{ secrets.SANDBOX_BASIC_PASS }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$TARGET" \
            "BASIC_PASS='$BASIC_PASS' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/e2e-run
          # KC_ADMIN_USERNAME / KC_ADMIN_PASSWORD come from the stack's own env
          set -a; . ~/projects/overwatch/orbit-poc/.env; set +a
          KC_ADMIN_BASE=http://127.0.0.1:8096/auth \
          BASIC_USER=clement BASIC_PASS="$BASIC_PASS" \
          python3 e2e_sandbox.py
          REMOTE
