name: unit tests

# Hermetic: a Postgres service and the repo, nothing else — no secrets, so this
# also runs on pull requests from forks. The VM gate (deploy/run-tests.sh) stays
# the always-on path before a deploy; this is the fast feedback on every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DB_DSN: "dbname=orbit user=orbit password=orbit host=localhost port=5432"
      ORG_DB_SECRET: ci-org-db-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orbit-poc/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -q -r orbit-poc/api/requirements.txt pytest httpx requests sgp4

      - name: Load the schema
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=orbit psql -h localhost -U orbit -d orbit \
            -f orbit-poc/db/init.sql >/dev/null

      - name: Run the suites
        working-directory: orbit-poc/api
        # Auto-discovery, matching deploy/run-tests.sh. Both entrypoints used
        # to name every file by hand, in two formats, with nothing failing if
        # you forgot one — so eight suites guarded nothing and two more raised
        # collection errors that aborted the run while the gate reported green
        # (#286). The only way to skip a test now is to say so, here.
        #   test_polar.py  live Polar API, needs POLAR_ACCESS_TOKEN. Polar is
        #                  the fallback provider since Creem became the MoR
        #                  (#269/#270); it runs on the VM gate, not here.
        env:
          # These suites write through the real code path; the marker says the
          # target database is disposable (#359).
          OVERWATCH_TEST_DB: "1"
        run: |
          python -m pytest -q --ignore=test_polar.py
