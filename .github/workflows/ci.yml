name: unit tests

# Hermetic: a Postgres service and the repo, nothing else — no secrets, so this
# also runs on pull requests from forks. The VM gate (deploy/run-tests.sh) stays
# the always-on path before a deploy; this is the fast feedback on every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DB_DSN: "dbname=orbit user=orbit password=orbit host=localhost port=5432"
      ORG_DB_SECRET: ci-org-db-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orbit-poc/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -q -r orbit-poc/api/requirements.txt pytest httpx requests sgp4

      - name: Load the schema
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=orbit psql -h localhost -U orbit -d orbit \
            -f orbit-poc/db/init.sql >/dev/null

      - name: Run the suites
        working-directory: orbit-poc/api
        # Same list as deploy/run-tests.sh, minus test_polar.py: that one calls
        # the live Polar API and needs a token, so it stays on the VM gate.
        run: |
          python -m pytest -q \
            test_subscription.py test_rls.py test_frontend.py test_selfhost.py \
            test_faq.py test_backup.py test_fields.py test_dashboards.py \
            test_spacecraft.py test_calibration.py test_metering.py \
            test_billing.py test_sandbox_ports.py test_env_headers.py \
            test_sandbox_deploy.py test_account_ui.py test_sandbox_auth.py \
            test_grafana_role.py test_api_hostnames.py test_org_grafana.py \
            test_auth_header.py test_deploy_target.py test_workflows.py \
            test_maplibre.py test_self_serve_access.py test_app_role.py \
            test_ops_role.py test_registrations.py test_oem.py test_ephemeris.py test_passes.py
