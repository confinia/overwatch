name: selfhost (boot proof)

# #276: a fresh machine with nothing but compose must reach a working control
# room by following selfhost/README.md — this job IS that machine. It boots
# the profile with generated secrets, waits for the front door, and proves
# the three things that define the edition: the globe serves, the API
# answers, and the billing surface does not exist (404).
on:
  pull_request:
    paths:
      - "selfhost/**"
      - "orbit-poc/api/**"
      - "orbit-poc/web/**"
      - "orbit-poc/db/**"
      - ".github/workflows/selfhost.yml"
  push:
    branches: [main]
    paths:
      - "selfhost/**"
      - ".github/workflows/selfhost.yml"
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compose the operator's .env
        working-directory: selfhost
        run: |
          cp .env.example .env
          for v in PG_PASSWORD KC_DB_PASSWORD KC_ADMIN_PASSWORD \
                   OVERWATCH_CLIENT_SECRET ORG_DB_SECRET GF_ADMIN_PASSWORD; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 24)/" .env
          done
          # CI boots the core; the ingest profile is exercised by its own tests
          sed -i "s/^COMPOSE_PROFILES=data/COMPOSE_PROFILES=/" .env
          grep -cE "=.{20,}" .env

      - name: Boot the stack exactly as the README says
        working-directory: selfhost
        run: docker compose up -d --build

      - name: Wait for the front door
        working-directory: selfhost
        run: |
          # both halves: the web container answers "/" well before the api is
          # ready, so waiting on the globe alone probes a half-booted stack
          for i in $(seq 1 60); do
            web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                  http://localhost:8080/ || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                  http://localhost:8080/api/v1/satellites || true)
            [ "$web" = "200" ] && [ "$api" = "200" ] && exit 0
            sleep 5
          done
          echo "web=$web api=$api after 5 minutes"
          docker compose logs --tail 40 caddy web api kc-bootstrap
          exit 1

      - name: The edition proves itself
        working-directory: selfhost
        run: |
          # localhost, not 127.0.0.1: redirects carry PUBLIC_BASE verbatim
          base="http://localhost:8080"
          echo "— the globe serves"
          curl -fsS "$base/" | grep -qi "overwatch" || { echo "no globe"; exit 1; }
          echo "— the API answers"
          curl -fsS "$base/api/v1/satellites" >/dev/null
          echo "— the auth flow redirects into our own Keycloak"
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$base/api/v1/auth/login" | tee /tmp/auth
          grep -q "307 .*$base/auth/realms/overwatch" /tmp/auth
          echo "— the billing surface DOES NOT EXIST (selfhost edition)"
          # each route probed with ITS method — a wrong method answers 405
          # (route exists, method mismatch) before the edition guard runs
          for probe in "GET /api/v1/billing/mode" "POST /api/v1/billing/webhook" \
                       "GET /api/v1/billing/status" "POST /api/v1/billing/checkout"; do
            m=${probe%% *}; p=${probe#* }
            sleep 1     # stay under the api's rate limiter — a 429 is not a verdict
            code=$(curl -s -o /dev/null -w '%{http_code}' -X "$m" "$base$p")
            [ "$code" = "404" ] || { echo "$m $p answered $code, not 404"; exit 1; }
          done
          echo "all proofs hold"

      - name: Logs on failure
        if: failure()
        working-directory: selfhost
        run: docker compose logs --tail 80 caddy api web keycloak
