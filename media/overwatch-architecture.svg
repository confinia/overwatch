<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55606e"/>
    </marker>
    <style>
      .title { font-size: 23px; font-weight: 700; fill: #16202e; }
      .subtitle { font-size: 13.5px; fill: #5b6472; }
      .band { font-size: 12px; font-weight: 700; fill: #7a8494; letter-spacing: .1em; }
      .btitle { font-size: 15px; font-weight: 650; }
      .bsub { font-size: 11.5px; }
      .cap { font-size: 12px; fill: #5b6472; }
      .tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; }
      .flow { stroke: #55606e; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="760" fill="#ffffff"/>

  <text x="540" y="38" text-anchor="middle" class="title">Overwatch — a UI layer over existing mission control systems</text>
  <text x="540" y="62" text-anchor="middle" class="subtitle">Open data and every MCS enter through one common ingestion, route to the right store, and serve one operator view.</text>

  <!-- ===================== UI LAYER ===================== -->
  <rect x="82" y="82" width="640" height="52" rx="10" fill="#eaf1fd" stroke="#1f5fd0" stroke-width="1.6"/>
  <text x="402" y="106" text-anchor="middle" class="btitle" fill="#123a86">Control room (web)</text>
  <text x="402" y="124" text-anchor="middle" class="bsub" fill="#3a4657">Grafana + MapLibre · passes · orbits · fleet &amp; station health</text>
  <rect x="742" y="82" width="251" height="52" rx="10" fill="#eaf1fd" stroke="#1f5fd0" stroke-width="1.6"/>
  <text x="867" y="106" text-anchor="middle" class="btitle" fill="#123a86">Mobile</text>
  <text x="867" y="124" text-anchor="middle" class="bsub" fill="#3a4657">iOS · Android · PWA</text>

  <!-- read api -> UI -->
  <path class="flow" d="M402,150 L402,136" marker-end="url(#arrow)"/>
  <path class="flow" d="M867,150 L867,136" marker-end="url(#arrow)"/>

  <!-- ===================== READ API ===================== -->
  <rect x="82" y="150" width="911" height="30" rx="8" fill="#e6eefb" stroke="#2a6fe0" stroke-width="1.4"/>
  <text x="537" y="170" text-anchor="middle" class="bsub" fill="#123a86" font-weight="650">Read API — /api/v1 (open data)  ·  /v1/tenants/{key} (private)</text>

  <!-- stores -> read api -->
  <path class="flow" d="M300,206 L300,182" marker-end="url(#arrow)"/>
  <path class="flow" d="M690,206 L690,182" marker-end="url(#arrow)"/>

  <!-- ===================== STORES ===================== -->
  <text x="82" y="202" class="band">OVERWATCH CORE — two stores, one boundary</text>
  <rect x="140" y="206" width="320" height="46" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
  <text x="300" y="228" text-anchor="middle" class="btitle" fill="#0f5e33">Open-data store</text>
  <text x="300" y="244" text-anchor="middle" class="bsub" fill="#2f6b48">public</text>
  <rect x="520" y="206" width="320" height="46" rx="10" fill="#e6eefb" stroke="#2a6fe0" stroke-width="1.6"/>
  <text x="680" y="228" text-anchor="middle" class="btitle" fill="#123a86">Tenant store</text>
  <text x="680" y="244" text-anchor="middle" class="bsub" fill="#3a4657">private · per key + quota</text>

  <!-- ingestion -> stores (route by scope) -->
  <path class="flow" d="M300,286 L300,254" marker-end="url(#arrow)"/>
  <path class="flow" d="M690,286 L690,254" marker-end="url(#arrow)"/>
  <text x="537" y="272" text-anchor="middle" class="cap" font-style="italic">route by scope</text>

  <!-- ===================== COMMON INGESTION ===================== -->
  <rect x="82" y="286" width="911" height="58" rx="12" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="2"/>
  <text x="537" y="311" text-anchor="middle" class="btitle" fill="#0a5c5c">Common ingestion — the adapter seam</text>
  <text x="537" y="331" text-anchor="middle" class="bsub" fill="#2f6a6a">Sample(name, ts, value)  →  dedupe  →  route by scope  →  store  ·  contract in bridge/README</text>

  <!-- adapters -> ingestion -->
  <path class="flow" d="M188,392 L188,346" marker-end="url(#arrow)"/>
  <path class="flow" d="M421,392 L421,346" marker-end="url(#arrow)"/>
  <path class="flow" d="M654,392 L654,346" marker-end="url(#arrow)"/>
  <path class="flow" d="M887,392 L887,346" marker-end="url(#arrow)"/>

  <!-- ===================== ADAPTERS ===================== -->
  <text x="82" y="382" class="band">ADAPTERS — one per source, the only source-specific code</text>
  <rect x="82" y="392" width="212" height="58" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
  <text x="188" y="416" text-anchor="middle" class="btitle" fill="#0f5e33">SatNOGS / CelesTrak</text>
  <text x="188" y="434" text-anchor="middle" class="bsub" fill="#2f6b48">decode · normalize · ingest</text>

  <rect x="315" y="392" width="212" height="58" rx="10" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="1.6"/>
  <text x="421" y="416" text-anchor="middle" class="btitle" fill="#0a5c5c">YAMCS adapter</text>
  <text x="421" y="434" text-anchor="middle" class="bsub" fill="#2f6a6a">WebSocket · REST</text>

  <rect x="548" y="392" width="212" height="58" rx="10" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="1.6"/>
  <text x="654" y="416" text-anchor="middle" class="btitle" fill="#0a5c5c">SCOS-2000 adapter</text>
  <text x="654" y="434" text-anchor="middle" class="bsub" fill="#2f6a6a">export / external interface</text>

  <rect x="781" y="392" width="212" height="58" rx="10" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="1.6"/>
  <text x="887" y="416" text-anchor="middle" class="btitle" fill="#0a5c5c">CCSDS MO adapter</text>
  <text x="887" y="434" text-anchor="middle" class="bsub" fill="#2f6a6a">MO Parameter service</text>

  <!-- sources -> adapters -->
  <path class="flow" d="M188,490 L188,452" marker-end="url(#arrow)"/>
  <path class="flow" d="M421,490 L421,452" marker-end="url(#arrow)"/>
  <path class="flow" d="M654,490 L654,452" marker-end="url(#arrow)"/>
  <path class="flow" d="M887,490 L887,452" marker-end="url(#arrow)"/>

  <!-- ===================== SOURCES ===================== -->
  <rect x="82" y="490" width="212" height="64" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
  <text x="188" y="516" text-anchor="middle" class="btitle" fill="#0f5e33">SatNOGS · CelesTrak</text>
  <text x="188" y="534" text-anchor="middle" class="bsub" fill="#2f6b48">open networks</text>
  <text x="188" y="548" text-anchor="middle" class="tag" fill="#1f9d55">LIVE</text>

  <rect x="315" y="490" width="212" height="64" rx="10" fill="#eef0f3" stroke="#9aa3b0" stroke-width="1.6"/>
  <text x="421" y="516" text-anchor="middle" class="btitle" fill="#2b333f">YAMCS</text>
  <text x="421" y="534" text-anchor="middle" class="bsub" fill="#5b6472">open-source MCS</text>
  <text x="421" y="548" text-anchor="middle" class="tag" fill="#1f9d55">SHIPPED</text>

  <rect x="548" y="490" width="212" height="64" rx="10" fill="#eef0f3" stroke="#9aa3b0" stroke-width="1.6"/>
  <text x="654" y="516" text-anchor="middle" class="btitle" fill="#2b333f">SCOS-2000</text>
  <text x="654" y="534" text-anchor="middle" class="bsub" fill="#5b6472">ESA institutional MCS</text>
  <text x="654" y="548" text-anchor="middle" class="tag" fill="#8a7112">PLANNED</text>

  <rect x="781" y="490" width="212" height="64" rx="10" fill="#eef0f3" stroke="#9aa3b0" stroke-width="1.6"/>
  <text x="887" y="516" text-anchor="middle" class="btitle" fill="#2b333f">other MCS</text>
  <text x="887" y="534" text-anchor="middle" class="bsub" fill="#5b6472">NanoSat MO Framework, …</text>
  <text x="887" y="548" text-anchor="middle" class="tag" fill="#8a7112">PLANNED</text>

  <text x="188" y="582" text-anchor="middle" class="cap">Open data</text>
  <text x="654" y="582" text-anchor="middle" class="cap">Existing mission control systems — unmodified</text>

  <!-- legend -->
  <g transform="translate(82,614)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eaf1fd" stroke="#1f5fd0"/>
    <text x="22" y="11" class="cap">Overwatch UI / read</text>
    <rect x="185" y="0" width="14" height="14" rx="3" fill="#e6f6f6" stroke="#0f8a8a"/>
    <text x="207" y="11" class="cap">common ingestion + adapters</text>
    <rect x="430" y="0" width="14" height="14" rx="3" fill="#e9f7ef" stroke="#1f9d55"/>
    <text x="452" y="11" class="cap">open data</text>
    <rect x="560" y="0" width="14" height="14" rx="3" fill="#eef0f3" stroke="#9aa3b0"/>
    <text x="582" y="11" class="cap">existing system, unmodified</text>
  </g>
</svg>
