<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55606e"/>
    </marker>
    <style>
      .title { font-size: 23px; font-weight: 700; fill: #16202e; }
      .subtitle { font-size: 13.5px; fill: #5b6472; }
      .band { font-size: 12px; font-weight: 700; fill: #7a8494; letter-spacing: .12em; }
      .btitle { font-size: 15px; font-weight: 650; }
      .bsub { font-size: 11.5px; }
      .cap { font-size: 12px; fill: #5b6472; }
      .tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; }
      .flow { stroke: #55606e; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="680" fill="#ffffff"/>

  <text x="540" y="40" text-anchor="middle" class="title">Overwatch — a UI layer over existing mission control systems</text>
  <text x="540" y="65" text-anchor="middle" class="subtitle">One control-room view. Any MCS plugs in through a small adapter, and the MCS is never modified.</text>

  <!-- ===================== UI LAYER ===================== -->
  <text x="70" y="92" class="band">OVERWATCH UI LAYER</text>
  <!-- control room -->
  <rect x="70" y="100" width="690" height="58" rx="10" fill="#eaf1fd" stroke="#1f5fd0" stroke-width="1.6"/>
  <text x="90" y="126" class="btitle" fill="#123a86">Control room (web)</text>
  <text x="90" y="146" class="bsub" fill="#3a4657">Grafana + MapLibre  ·  passes  ·  orbits  ·  fleet &amp; station health</text>
  <!-- mobile -->
  <rect x="781" y="100" width="229" height="58" rx="10" fill="#eaf1fd" stroke="#1f5fd0" stroke-width="1.6"/>
  <text x="895" y="126" text-anchor="middle" class="btitle" fill="#123a86">Mobile</text>
  <text x="895" y="146" text-anchor="middle" class="bsub" fill="#3a4657">iOS · Android · PWA</text>

  <!-- arrows core -> UI -->
  <path class="flow" d="M415,198 L415,160" marker-end="url(#arrow)"/>
  <path class="flow" d="M895,198 L895,160" marker-end="url(#arrow)"/>

  <!-- ===================== CORE ===================== -->
  <text x="70" y="192" class="band">OVERWATCH CORE</text>
  <rect x="70" y="200" width="690" height="58" rx="10" fill="#e6eefb" stroke="#2a6fe0" stroke-width="1.6"/>
  <text x="90" y="226" class="btitle" fill="#123a86">Tenant API — POST /v1/tenants/{key}/telemetry</text>
  <text x="90" y="246" class="bsub" fill="#3a4657">private per-tenant telemetry store  ·  key + quota  ·  isolated</text>

  <rect x="781" y="200" width="229" height="58" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
  <text x="895" y="226" text-anchor="middle" class="btitle" fill="#0f5e33">Open-data store</text>
  <text x="895" y="246" text-anchor="middle" class="bsub" fill="#2f6b48">public</text>

  <!-- arrows adapters -> core -->
  <path class="flow" d="M188,320 L188,260" marker-end="url(#arrow)"/>
  <path class="flow" d="M421,320 L421,260" marker-end="url(#arrow)"/>
  <path class="flow" d="M654,320 L654,260" marker-end="url(#arrow)"/>
  <path class="flow" d="M887,320 L893,260" marker-end="url(#arrow)"/>

  <!-- ===================== ADAPTER SEAM ===================== -->
  <text x="70" y="300" class="band" style="letter-spacing:.02em; font-size:11.5px">ADAPTER SEAM — one adapter per MCS, sharing the MCS-neutral core:  Sample(name, ts, value) → dedupe → push  ·  contract: bridge/README</text>

  <!-- three MCS adapters -->
  <rect x="82" y="320" width="212" height="60" rx="10" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="1.6"/>
  <text x="188" y="345" text-anchor="middle" class="btitle" fill="#0a5c5c">YAMCS adapter</text>
  <text x="188" y="364" text-anchor="middle" class="bsub" fill="#2f6a6a">WebSocket subscription · REST</text>

  <rect x="315" y="320" width="212" height="60" rx="10" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="1.6"/>
  <text x="421" y="345" text-anchor="middle" class="btitle" fill="#0a5c5c">SCOS-2000 adapter</text>
  <text x="421" y="364" text-anchor="middle" class="bsub" fill="#2f6a6a">export / external interface</text>

  <rect x="548" y="320" width="212" height="60" rx="10" fill="#e6f6f6" stroke="#0f8a8a" stroke-width="1.6"/>
  <text x="654" y="345" text-anchor="middle" class="btitle" fill="#0a5c5c">CCSDS MO adapter</text>
  <text x="654" y="364" text-anchor="middle" class="bsub" fill="#2f6a6a">MO Parameter service</text>

  <!-- open-data ingest -->
  <rect x="781" y="320" width="212" height="60" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
  <text x="887" y="345" text-anchor="middle" class="btitle" fill="#0f5e33">Open-data ingest</text>
  <text x="887" y="364" text-anchor="middle" class="bsub" fill="#2f6b48">SatNOGS · CelesTrak pipeline</text>

  <!-- arrows sources -> adapters -->
  <path class="flow" d="M188,452 L188,382" marker-end="url(#arrow)"/>
  <path class="flow" d="M421,452 L421,382" marker-end="url(#arrow)"/>
  <path class="flow" d="M654,452 L654,382" marker-end="url(#arrow)"/>
  <path class="flow" d="M887,452 L887,382" marker-end="url(#arrow)"/>

  <!-- ===================== SOURCES ===================== -->
  <rect x="82" y="452" width="212" height="66" rx="10" fill="#eef0f3" stroke="#9aa3b0" stroke-width="1.6"/>
  <text x="188" y="478" text-anchor="middle" class="btitle" fill="#2b333f">YAMCS</text>
  <text x="188" y="497" text-anchor="middle" class="bsub" fill="#5b6472">open-source MCS</text>
  <text x="188" y="511" text-anchor="middle" class="tag" fill="#1f9d55">SHIPPED</text>

  <rect x="315" y="452" width="212" height="66" rx="10" fill="#eef0f3" stroke="#9aa3b0" stroke-width="1.6"/>
  <text x="421" y="478" text-anchor="middle" class="btitle" fill="#2b333f">SCOS-2000</text>
  <text x="421" y="497" text-anchor="middle" class="bsub" fill="#5b6472">ESA institutional MCS</text>
  <text x="421" y="511" text-anchor="middle" class="tag" fill="#8a7112">PLANNED</text>

  <rect x="548" y="452" width="212" height="66" rx="10" fill="#eef0f3" stroke="#9aa3b0" stroke-width="1.6"/>
  <text x="654" y="478" text-anchor="middle" class="btitle" fill="#2b333f">other MCS</text>
  <text x="654" y="497" text-anchor="middle" class="bsub" fill="#5b6472">NanoSat MO Framework, …</text>
  <text x="654" y="511" text-anchor="middle" class="tag" fill="#8a7112">PLANNED</text>

  <rect x="781" y="452" width="212" height="66" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
  <text x="887" y="478" text-anchor="middle" class="btitle" fill="#0f5e33">SatNOGS · CelesTrak</text>
  <text x="887" y="497" text-anchor="middle" class="bsub" fill="#2f6b48">open networks</text>
  <text x="887" y="511" text-anchor="middle" class="tag" fill="#1f9d55">LIVE</text>

  <!-- captions -->
  <text x="421" y="548" text-anchor="middle" class="cap">Existing mission control systems — unmodified</text>
  <text x="887" y="548" text-anchor="middle" class="cap">Open data</text>

  <!-- legend -->
  <g transform="translate(70,588)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eaf1fd" stroke="#1f5fd0"/>
    <text x="22" y="11" class="cap">Overwatch (ours)</text>
    <rect x="180" y="0" width="14" height="14" rx="3" fill="#e6f6f6" stroke="#0f8a8a"/>
    <text x="202" y="11" class="cap">adapter (one per MCS)</text>
    <rect x="400" y="0" width="14" height="14" rx="3" fill="#eef0f3" stroke="#9aa3b0"/>
    <text x="422" y="11" class="cap">existing system, unmodified</text>
    <rect x="640" y="0" width="14" height="14" rx="3" fill="#e9f7ef" stroke="#1f9d55"/>
    <text x="662" y="11" class="cap">open data</text>
  </g>
</svg>
