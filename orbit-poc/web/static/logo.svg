<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Overwatch">
  <title>Overwatch</title>
  <g fill="none" stroke="#5aa9ff" stroke-width="2.5" stroke-linecap="round">
    <!-- orbit -->
    <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(-25 32 32)"/>
    <!-- globe -->
    <circle cx="32" cy="32" r="10"/>
    <!-- latitudes -->
    <path d="M23 30c5 3 13 3 18 0" stroke-width="1.5" opacity="0.6"/>
    <path d="M24.5 35c4 2.4 11 2.4 15 0" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- satellite on the orbit -->
  <circle cx="46.6" cy="16.5" r="3.4" fill="#5aa9ff"/>
</svg>
