<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Overwatch">
  <!-- Simplified logo mark for the tab (16px): solid globe, bold orbit, one
       satellite, no latitude lines. Full mark with latitudes is logo.svg. -->
  <circle cx="16" cy="16" r="16" fill="#0d1b2f"/>
  <ellipse cx="16" cy="16" rx="12.5" ry="5.2" transform="rotate(-22 16 16)"
           fill="none" stroke="#5aa9ff" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="4.6" fill="#5aa9ff"/>
  <circle cx="21.9" cy="9.3" r="2.1" fill="#eaf3ff"/>
</svg>
