<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Your account — Overwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#10151d; color:#e8eaed; font:16px/1.6 system-ui,-apple-system,sans-serif; }
  main { max-width:34rem; width:100%; padding:2.5rem 2rem; }
  h1 { font-size:1.6rem; margin:0 0 1rem; } h1 span { color:#7ab8ff; }
  a { color:#7ab8ff; text-decoration:none; } a:hover { text-decoration:underline; }
  .card { background:#0b0f16; border:1px solid #26314a; border-radius:10px;
          padding:1.1rem 1.3rem; margin:.8rem 0; }
  .row { display:flex; justify-content:space-between; gap:1rem; padding:.25rem 0; }
  .row b { font-weight:600; }
  .dim { opacity:.7; }
  .badge { display:inline-block; padding:.15rem .6rem; border-radius:999px;
           font-size:.8rem; font-weight:700; letter-spacing:.05em; vertical-align:middle; }
  .badge.pro  { background:#16233a; border:1px solid #2c6cb0; color:#7ab8ff; }
  .badge.free { background:#1a1f28; border:1px solid #3a4356; color:#aab2c0; }
  .cta { display:inline-block; margin:.4rem .4rem 0 0; padding:.55rem 1.05rem;
         border:1px solid #2c6cb0; border-radius:8px; background:#16233a; color:#cfe4ff;
         cursor:pointer; font:inherit; }
  .cta.secondary { border-color:#3a4356; background:transparent; color:#aab2c0; }
  #banner { display:none; border:1px solid #2c6cb0; background:#16233a; border-radius:8px;
            padding:.8rem 1rem; margin:0 0 1rem; }
  footer { margin-top:1.6rem; font-size:.8rem; opacity:.7; }
  h2 { font-size:1.05rem; margin:1.8rem 0 .3rem; color:#9fc5f8; }
  pre { background:#0b0f16; border:1px solid #26314a; border-radius:8px;
        padding:.8rem .9rem; overflow-x:auto; font-size:.75rem; margin:.5rem 0; }
  code.key { background:#16233a; border:1px solid #2c6cb0; border-radius:6px;
             padding:.2rem .45rem; font-size:.85rem; word-break:break-all; }
  .revoked { opacity:.45; text-decoration:line-through; }
  button.link { background:none; border:0; color:#7ab8ff; cursor:pointer;
                font:inherit; padding:0; text-decoration:underline; }
</style></head><body><main>
<h1><span>Overwatch</span> — your account</h1>
<div id="banner">Payment received — thank you. Your subscription is active below.</div>
<div id="content" class="card"><span class="dim">Loading…</span></div>
<div id="actions"></div>
<div id="keys" style="display:none">
  <h2>Push your own telemetry</h2>
  <p class="dim">A key identifies your organization when you push data. It is
  shown once, at creation — store it like a password.</p>
  <div id="keylist" class="card"><span class="dim">Loading…</span></div>
  <button class="cta" onclick="mintKey()">Create a key</button>
  <div id="fresh" style="display:none"></div>
</div>
<footer><a href="/">← Back to the control room</a> ·
<a href="mailto:contact@confinia.io">Contact</a></footer>
<script>
const $ = id => document.getElementById(id);
function esc(s){ const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

async function post(path, body){
  const r = await fetch(path, {
    method: "POST",
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `Request failed (${r.status})`);
  return d;
}
async function upgrade(){
  try { const d = await post("/api/v1/billing/checkout"); location.href = d.checkout_url; }
  catch (e) { alert(e.message); }
}
async function portal(){
  try { const d = await post("/api/v1/billing/portal"); location.href = d.portal_url; }
  catch (e) { alert(e.message); }
}

function pushSnippet(token){
  const base = location.origin;
  // -i prints the status line: a push that works answers 202 with
  // {"accepted":N}. Without it a rejection looks exactly like a success —
  // notably behind the basic-auth gate on sandbox/staging, whose 401 has an
  // empty body (#161). Those hosts also need the gate credentials.
  const gated = /^(sandbox|staging)\./.test(location.hostname);
  const auth = gated ? "  -u '<gate-user>:<gate-password>' \\\n" : "";
  return `curl -i -X POST ${base}/api/v1/tenants/${token}/telemetry \\
${auth}  -H 'content-type: application/json' \\
  -d '{"satellite":"MYSAT-1","points":[
        {"ts":"${new Date().toISOString()}","field":"battery_v","value":7.42}]}'`;
}

async function renderKeys(){
  $("keys").style.display = "block";
  try {
    const list = await (await fetch("/api/v1/org/tokens")).json();
    if (!Array.isArray(list) || !list.length){
      $("keylist").innerHTML =
        `<span class="dim">No key yet — create one to start pushing.</span>`;
      return;
    }
    $("keylist").innerHTML = list.map(k =>
      `<div class="row${k.revoked ? " revoked" : ""}">` +
      `<span><code>${esc(k.token)}</code> · ${esc(k.label || "key")}</span>` +
      (k.revoked ? `<span class="dim">revoked</span>`
                 : `<button class="link" onclick="revokeKey('${esc(k.token)}')">revoke</button>`) +
      `</div>`).join("");
  } catch (e) {
    $("keylist").innerHTML = `<span class="dim">Could not load your keys.</span>`;
  }
}

async function mintKey(){
  const label = prompt("Name this key (e.g. ground-segment):", "ground-segment");
  if (label === null) return;
  try {
    const d = await post("/api/v1/org/tokens", { label: label || "key" });
    $("fresh").style.display = "block";
    $("fresh").innerHTML =
      `<div class="card"><b>Your key — shown once</b><br>` +
      `<code class="key">${esc(d.token)}</code>` +
      `<p class="dim" style="margin:.7rem 0 .2rem">Push a first point with it:</p>` +
      `<pre>${esc(pushSnippet(d.token))}</pre>` +
      `<span class="dim">A successful push answers <code>202</code> with ` +
      `<code>{"accepted":1}</code>; the satellite then appears in your ` +
      `organization only.</span></div>`;
    renderKeys();
  } catch (e) { alert(e.message); }
}

async function revokeKey(prefix){
  // the list only exposes a masked prefix; ask for the full key to revoke
  const full = prompt(`Paste the full key starting with ${prefix.replace("…","")} to revoke it:`);
  if (!full) return;
  const r = await fetch(`/api/v1/org/tokens/${encodeURIComponent(full.trim())}`,
                        { method: "DELETE" });
  if (r.ok || r.status === 204) renderKeys();
  else alert((await r.json().catch(()=>({}))).detail || "Could not revoke that key.");
}

async function createOrg(){
  // A double-fired click sends two concurrent creates; the second races the
  // first inside Keycloak and surfaces a scary failure for an org that
  // exists. One in-flight create at a time.
  const btn = document.getElementById("act-create-org");
  if (btn){ if (btn.disabled) return; btn.disabled = true; }
  const name = prompt("Name your organization:");
  if (!name){ if (btn) btn.disabled = false; return; }
  try {
    await post("/api/v1/orgs", { name });
  } catch (e) {
    if (!/already belong/i.test(e.message)) {
      alert(e.message);
      if (btn) btn.disabled = false;
      return;
    }
  }
  // Keycloak puts the organization in the token at login, so sign in again for
  // the new membership to take effect (#157).
  alert("Organization created — signing you in again to activate it.");
  location.href = "/api/v1/auth/login";
}

async function load(){
  if (new URLSearchParams(location.search).get("upgraded")){
    $("banner").style.display = "block";
    history.replaceState(null, "", location.pathname);   // don't re-show on reload
  }
  let me;
  try {
    const r = await fetch("/api/v1/me");
    if (!r.ok) throw 0;
    me = await r.json();
  } catch (e) {
    $("content").innerHTML = `<span class="dim">You are not signed in.</span>`;
    $("actions").innerHTML =
      `<a class="cta" id="act-signin" href="/api/v1/auth/login">Sign in / Register</a>`;
    return;
  }
  if (!me.organization){
    $("content").innerHTML =
      `<div class="row"><span>Signed in as</span><b>${esc(me.email || me.name || me.sub)}</b></div>` +
      `<div class="row"><span class="dim">No organization yet — create yours from the control room.</span></div>`;
    $("actions").innerHTML =
      `<button class="cta" id="act-create-org" onclick="createOrg()">Create your organization</button>` +
      `<a class="cta secondary" href="/api/v1/auth/logout" onclick="return confirm('Sign out of Overwatch?')">Sign out</a>`;
    return;
  }
  let s = null;
  try { s = await (await fetch("/api/v1/billing/status")).json(); } catch (e) {}
  const pro = !!(s && s.pro);
  const badge = `<span class="badge ${pro ? "pro" : "free"}">${pro ? "PRO" : "FREE"}</span>`;
  const until = s && s.entitled_until ? new Date(s.entitled_until).toLocaleDateString() : null;
  const rows = [
    `<div class="row"><span>Signed in as</span><b>${esc(me.email || me.name || me.sub)}</b></div>`,
    `<div class="row"><span>Organization</span><b>${esc(me.organization.name)}</b></div>`,
    `<div class="row"><span>Plan</span><span id="plan">${badge}</span></div>`,
  ];
  if (s){
    if (s.sub_status) rows.push(
      `<div class="row"><span>Subscription</span><b>${esc(s.sub_status)}</b></div>`);
    if (until) rows.push(
      `<div class="row"><span>${s.sub_status === "canceled" ? "Access until" : "Renews"}</span><b>${until}</b></div>`);
    const u = s.usage || {};
    rows.push(`<div class="row dim"><span>Usage (${esc(u.period || "this month")})</span>` +
      `<span>${u.frames ?? 0} frames · ${u.tm ?? 0} TM · ${u.tc ?? 0} TC</span></div>`);
  } else {
    rows.push(`<div class="row dim"><span>Billing status unavailable right now.</span></div>`);
  }
  $("content").innerHTML = rows.join("");
  renderKeys();
  $("actions").innerHTML =
    (pro ? `<button class="cta" id="act-portal" onclick="portal()">Invoices / manage subscription</button>`
         : `<button class="cta" id="act-upgrade" onclick="upgrade()">Upgrade to Pro</button>`) +
    `<a class="cta secondary" href="/api/v1/auth/logout" onclick="return confirm('Sign out of Overwatch?')">Sign out</a>`;
}
load();
</script>
</main></body></html>
