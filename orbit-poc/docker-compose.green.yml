# GREEN app stack — twin of docker-compose.blue.yml on ports 9081/9082.
#   podman-compose -p green -f docker-compose.green.yml up -d --build
# See the blue file for the full architecture comment.

services:
  web:
    build: ./web
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "overwatch-web"
    env_file:
      - .env          # DB_DSN — never committed
      - version.env
    ports:
      - "127.0.0.1:12210:8080"  # 1PESI: overwatch(2)·green(2)·web(1) (#213)
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  api:
    build: ./api
    environment:
      # DB_DSN comes from .env (never committed)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "overwatch-api"
      REQUIRE_API_KEY: "false"
      # Billing is not launched: keep off (inert) on the prod blue/green stack.
      # staging (candidate color) shares this exact config; payment flows are
      # validated in the sandbox (POLAR_ENV=sandbox). Flip to "production" the
      # day billing goes live. See ENVIRONMENTS.md.
      # our stack: the paid edition. Self-host defaults to "selfhost" (#276).
      OVERWATCH_EDITION: "cloud"
      # Project-qualified, NOT the bare `grafana` alias (#328). This container
      # joins ovw2_default for the Keycloak path, and the sandbox and staging
      # Grafanas are attached there too — each registering the alias `grafana`.
      # It resolved to one of THEM, so every provisioning call authenticated
      # against another environment's Grafana, got 401, and was discarded
      # without a log line: ops alerts never arrived and per-org dashboards
      # would have been created in the sandbox.
      GF_URL: "http://orbit-poc_grafana_1:3000"
      POLAR_ENV: "off"
    env_file:
      - .env
      - version.env
    volumes:
      - ./deploy/geoip:/geoip:ro
      # the admin-only ops boards the api seeds into the ops Grafana org (#168)
      - ./grafana/ops-dashboards:/ops-dashboards:ro
      # ops signup alerts as code (#201): rules + contact point + policy
      - ./grafana/ops-alerts.json:/ops-alerts.json:ro
    networks:
      - default
      - v2net          # direct server-to-server path to Keycloak
    ports:
      - "127.0.0.1:12220:8000"  # 1PESI: overwatch(2)·green(2)·api(2) (#213)
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

networks:
  default:
    external: true
    name: orbit-poc_default
  v2net:
    external: true
    name: ovw2_default
