# Orbit POC — one command: `docker compose up`
#
# Architecture (the point of the whole thing):
#
#   CelesTrak ─┐                 ┌─ MapLibre globe (web) ── reads cache only
#   SatNOGS  ──┤─►  ingest  ─►  db (Postgres)                │
#              │  (only thing            └─ Grafana ─────────┘ reads cache only
#              │   touching                 (embedded per-satellite panels)
#              │   upstream)
#
# Only `ingest` (CelesTrak) and `satnogs-gateway` (SatNOGS, the shared rate-
# limited door — #449) call external APIs. The browser talks to `web` and to
# `grafana`; both read exclusively from the local cache in `db`.

# Production (VM OVH, podman + podman-compose): everything binds to
# 127.0.0.1 only; the public entrypoint is the shared caddy edge in
# ~/projects/confinia (host network), which terminates TLS for
# overwatch.confinia.io and proxies to web (8081) and grafana (3001).
# See DEV.md at the repo root.

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: orbit
      POSTGRES_DB: orbit
    env_file:
      - .env          # POSTGRES_PASSWORD — never committed
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Shared, DISK-bound VM: cap the prod database above its measured steady
    # state (~40 MB idle, more under ingest write load). shared_buffers / work_mem
    # should also be tuned for a shared box (platform rule 3) — follow-up.
    cpus: "2.0"
    mem_limit: 1g

  ingest:
    build: ./ingest
    depends_on:
      db:
        condition: service_healthy
      satnogs-gateway:
        condition: service_started
    environment:
      # DB_DSN comes from .env (never committed) — see .env.example
      ELEMENTS_INTERVAL: "21600"   # 6h — respect CelesTrak update cadence
      # Bulk constellations (one CelesTrak request per group per cadence).
      # Empty = telemetry-only showcase (product decision 2026-07-18).
      CELESTRAK_GROUPS: ""
      POSITION_INTERVAL: "15"      # local propagation only, no external calls
      TELEMETRY_INTERVAL: "1800"   # 30m
      # All SatNOGS access goes through the egress gateway (#449): one
      # rate-limited, cached door shared by every caller. Blackholed below so
      # the ingest cannot reach db.satnogs.org except through it.
      SATNOGS_BASE: "http://satnogs-gateway:8088/api"
    # SATNOGS_TOKEN lives in .env (podman-compose does not interpolate
    # ${VAR:-default}, hence env_file rather than inline interpolation).
    env_file:
      - .env
    extra_hosts:
      # sole-egress: if a code path or batch job tries db.satnogs.org directly
      # it fails fast instead of overspending the shared per-user budget.
      - "db.satnogs.org:127.0.0.1"
      - "network.satnogs.org:127.0.0.1"
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

  # SatNOGS egress gateway (#449): the ONLY process that reaches db.satnogs.org.
  # Every caller (ingest, batch tooling) points at it via SATNOGS_BASE, so the
  # per-user 6/min limit is enforced in one place no new caller can bypass; it
  # also caches responses and persists a cooldown when refused. Cloud-only:
  # selfhost's single ingest talks to SatNOGS directly.
  satnogs-gateway:
    build: ./gateway
    depends_on:
      db:
        condition: service_healthy
    environment:
      SATNOGS_MIN_GAP: "11"   # 6/min per-user limit + margin (satnogs-db settings)
      # Emit request-rate metrics through the same OTel pipeline the api uses
      # (otel-collector -> prometheus -> grafana OpsMetrics). ovw.satnogs.requests
      # carries a disposition label (HIT/MISS/COOL/ERR) for the cache-vs-resend split.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "overwatch-satnogs-gateway"
    # SATNOGS_TOKEN + DB_DSN come from .env (never committed).
    env_file:
      - .env
    # Resource ceiling so this can never starve the shared, DISK-bound VM. It is
    # a tiny single-process HTTP pacer that serialises requests, so 0.25 CPU /
    # 128 MB is generous. podman-compose maps these to --cpus / --memory; verify
    # with `podman inspect satnogs-gateway --format '{{.HostConfig.Memory}} {{.HostConfig.NanoCpus}}'`.
    cpus: "0.25"
    mem_limit: 128m
    # A restart policy needs a healthcheck, or a crash-on-boot becomes a loop
    # that hammers the disk with logs. /healthz is a static reply, no upstream.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # NOTE: web + api are NOT here — they live in the color stacks
  # (docker-compose.blue.yml / docker-compose.green.yml), two complete
  # independent compose projects deployed by deploy/slots.sh. This file is
  # the shared CORE: data, ingest, observability, and the app caddy that
  # routes production to the live color.

  # Overwatch's own caddy: all overwatch routing (prod/staging vhosts,
  # blue/green switching, staging auth, access log) self-owned. The
  # platform edge terminates TLS and forwards both hostnames here (:8090).
  # /etc/caddy is a directory mount: deploy/slots.sh regenerates
  # Caddyfile from Caddyfile.tmpl (color swap) + graceful reload.
  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
    ports:
      - "127.0.0.1:12000:80"    # 1PESI: overwatch(2)·prod(0)·caddy(0) — edge target (#213)
    networks:
      - default
      - v2net          # reach the isolated v2 stack (keycloak) by DNS
    # NOTE: the ovw-sandbox network is attached OUT OF BAND by `make sandbox-up`
    # (podman network connect), NOT declared here — so base ops never depend on
    # the sandbox stack existing (a down sandbox must never break prod caddy).
    cpus: "1.0"
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Anonymous + embedding: fine for a LOCAL POC. In production this is
      # exactly where the cookie/JWT auth-proxy replaces anonymous access.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "disabled"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "15s"
      # Served under /grafana behind caddy so the iframe embed is same-origin
      # in production (no third-party-cookie / CSP headaches).
      GF_SERVER_ROOT_URL: "https://overwatch.confinia.io/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana SMTP — OVH (EU, RULES.md). Non-secret config lives here as code;
      # only GF_SMTP_PASSWORD comes from .env (Rule 4).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "ssl0.ovh.net:587"
      GF_SMTP_USER: "alert@confinia.io"
      GF_SMTP_FROM_ADDRESS: "alert@confinia.io"
      GF_SMTP_FROM_NAME: "Overwatch"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    # GF_SECURITY_ADMIN_PASSWORD comes from .env — never committed.
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:12040:3000"  # 1PESI: overwatch(2)·prod(0)·grafana(4) (#213)
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

  # --- Access observability: web traces -> collector (spanmetrics) ->
  # prometheus -> grafana "ops" folder (admin-only, anonymous excluded) ---
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

networks:
  default: {}
  v2net:
    external: true
    name: ovw2_default

volumes:
  pgdata:
  prom_data:
  grafana_data:   # users + ACLs (ops folder restriction) survive recreation
  caddy_data:     # overwatch access logs survive recreation
