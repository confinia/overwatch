apiVersion: 1
datasources:
  - name: OrbitCache
    uid: orbitcache          # fixed uid — referenced by the dashboard JSON
    type: postgres
    access: proxy
    url: db:5432
    user: orbit
    secureJsonData:
      # from the DB_PASSWORD env var (grafana loads .env; never committed)
      password: $__env{DB_PASSWORD}
    jsonData:
      database: orbit
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
