apiVersion: 1
datasources:
  - name: OrbitCache
    uid: orbitcache          # fixed uid — referenced by the dashboard JSON
    type: postgres
    access: proxy
    url: db:5432
    # Least-privilege role (#129): Grafana's datasource proxy executes arbitrary
    # SQL for any caller, including the anonymous Viewer the public embeds need.
    # The role IS the boundary: SELECT on the public tables only, NOBYPASSRLS —
    # never the app's `orbit` role, which can read private tenant data.
    user: grafana_ro
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    jsonData:
      database: orbit
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
