# Overlay for a demo running NEXT TO an Overwatch stack on the same host:
# a host cannot reach its own public edge (hairpin), so the bridge joins the
# stack's compose network and pushes to its api directly.
#
#   TENANT_KEY=... docker compose -f docker-compose.yml -f docker-compose.internal.yml up -d
#
# OVERWATCH_NETWORK is the stack's network (orbit-poc_default for a stack
# started from orbit-poc/); the api answers as http://api:8000 on it.
services:
  bridge:
    networks: [default, overwatch]
    environment:
      # Through the production caddy, NOT `api` (#524). On this network `api`
      # resolves to BOTH colours, so half the demo's telemetry went into the
      # standby — and when the candidate is being rebuilt mid-deploy the push
      # dies, which is what downgraded the demo to polling in #521. caddy
      # routes to the LIVE colour with health checks and failover, so it is
      # the correct front door rather than a workaround. It picks its vhost by
      # Host, hence OVERWATCH_HOST.
      OVERWATCH_URL: ${OVERWATCH_URL:-http://orbit-poc_caddy_1:80/api}
      OVERWATCH_HOST: ${OVERWATCH_HOST:-overwatch.confinia.io}

networks:
  default: {}          # podman-compose wants the implicit one spelled out
  overwatch:
    external: true
    name: ${OVERWATCH_NETWORK:-orbit-poc_default}
