# Overwatch SANDBOX — a public, fully isolated CLONE of production for Polar
# billing validation, served at https://sandbox.overwatch.confinia.io.
#
#   make sandbox-up   (podman-compose -p ovw-sandbox -f docker-compose.yml up -d --build)
#
# Isolation is the whole point: OWN Postgres (own volume), OWN ingest / api / web
# / grafana — it shares NOTHING with prod (orbit-poc_db_1 + blue/green). Pointed
# at Polar SANDBOX. Billing/metering here can never touch prod data or real money.
#
# Public entry: the confinia edge terminates TLS for sandbox.overwatch.confinia.io
# -> the overwatch caddy (orbit-poc/deploy/caddy/Caddyfile.tmpl), which basic-auth-
# gates it (except the Polar webhook path, which Polar must reach) and reverse-
# proxies to this stack's containers over the ovw-sandbox_default network. DNS for
# the subdomain is the one prerequisite you own.
#
# Secrets in ./.env (Polar sandbox creds, SATNOGS_TOKEN, GF admin pw,
# ORG_DB_SECRET) — copy .env.example and fill. Never committed.

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    volumes:
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - sb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Clone the public fleet into the sandbox DB (same ingest as prod). Optional:
  # comment out to run a data-empty sandbox focused purely on private billing.
  ingest:
    build: ../ingest
    depends_on:
      db:
        condition: service_healthy
    environment:
      ELEMENTS_INTERVAL: "21600"
      CELESTRAK_GROUPS: ""
      POSITION_INTERVAL: "15"
      TELEMETRY_INTERVAL: "1800"
    env_file:
      - .env            # SATNOGS_TOKEN
    restart: unless-stopped

  api:
    build: ../api
    depends_on:
      db:
        condition: service_healthy
    environment:
      REQUIRE_API_KEY: "false"
      PUBLIC_BASE: "https://sandbox.overwatch.confinia.io"
      # Creem TEST MODE (rule 27: Creem.io is the merchant of record — EU).
      # The env is derived from the key itself: a creem_test_ key in .env
      # routes to test-api.creem.io. CREEM_ALLOW_STUB=1 keeps the in-app stub
      # flow working before/without real test credentials.
      BILLING_PROVIDER: "creem"
      CREEM_ALLOW_STUB: "1"
      # Legacy Polar sandbox knobs — BILLING_PROVIDER=polar flips back to them
      # in one variable while the Creem path is being verified (#269).
      POLAR_ENV: "sandbox"
      POLAR_ALLOW_STUB: "1"
      # Identity: ONE shared Keycloak, dedicated realm overwatch-sandbox
      # (TENANT.md §1 "Sandbox identity") — issuer-URL distinction, full
      # user/key/token separation from the prod realm `overwatch`.
      KC_ISSUER: "https://sandbox.overwatch.confinia.io/auth/realms/overwatch-sandbox"
      KC_INTERNAL: "http://ovw2_keycloak_1:8080/auth/realms/overwatch-sandbox"
    env_file:
      - .env            # CREEM_* / POLAR_* / ORG_DB_SECRET / OVERWATCH_CLIENT_SECRET / KC_ADMIN_*
    networks:
      - default
      - v2net           # server-to-server path to the shared Keycloak
    ports:
      # Dedicated sandbox port range 8190-8199 (see the platform edge Caddyfile
      # for the VM-wide reservation table). 8191 = api debug/webhook-test port;
      # NOT 8087 (taken by mapmax_web_1 on the VM).
      - "127.0.0.1:12420:8000"  # 1PESI: overwatch(2)·sandbox(4)·api(2) (#213)
    volumes:
      # the admin-only ops boards the api seeds into the ops Grafana org (#168)
      - ../grafana/ops-dashboards:/ops-dashboards:ro
      # ops signup alerts as code (#201): rules + contact point + policy
      - ../grafana/ops-alerts.json:/ops-alerts.json:ro
    restart: unless-stopped

  web:
    build: ../web
    depends_on:
      - api
    env_file:
      - .env            # DB_DSN (least-privilege app role, #133)
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "disabled"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_SERVER_ROOT_URL: "https://sandbox.overwatch.confinia.io/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana SMTP — OVH (EU, RULES.md). Non-secret config as code; only
      # GF_SMTP_PASSWORD comes from .env (Rule 4).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "ssl0.ovh.net:587"
      GF_SMTP_USER: "alert@confinia.io"
      GF_SMTP_FROM_ADDRESS: "alert@confinia.io"
      GF_SMTP_FROM_NAME: "Overwatch (sandbox)"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      # OIDC via the shared Keycloak, sandbox realm (#13). Anonymous stays on
      # for the public embeds; a signed-in user lands in their own Grafana org
      # (provisioned by the API) as Editor — their private boards, their data.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Overwatch"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "overwatch"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://sandbox.overwatch.confinia.io/auth/realms/overwatch-sandbox/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://ovw2_keycloak_1:8080/auth/realms/overwatch-sandbox/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://ovw2_keycloak_1:8080/auth/realms/overwatch-sandbox/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true"
      # The datasource provisioning resolves password: $__env{DB_PASSWORD}. The
      # sandbox db password is the hardcoded 'orbit' (POSTGRES_PASSWORD above),
      # so provide it here — else the datasource auth fails and every panel 400s
      # ("No data" + norad templating error).
      DB_PASSWORD: "orbit"
    env_file:
      - .env            # GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - sb_grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - default
      - v2net           # OAuth code exchange (TOKEN_URL/API_URL) resolves the
                        # shared Keycloak by name — else login 401s (#151)
    restart: unless-stopped

  # The sandbox's OWN application caddy — dedicated port 8190 (range 8190-8199).
  # The platform upstream edge proxies sandbox.overwatch.confinia.io here; this
  # caddy routes to web/api/grafana within the ovw-sandbox network. Self-
  # contained: it replaces the old out-of-band attach of the prod caddy, so a
  # down sandbox can never affect prod routing.
  caddy:
    image: docker.io/library/caddy:2
    depends_on:
      - web
      - api
      - grafana
    ports:
      - "127.0.0.1:12400:80"    # 1PESI: overwatch(2)·sandbox(4)·caddy(0) — edge target (#213)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sb_caddy_data:/data
      - sb_caddy_config:/config
    networks:
      - default
      - v2net           # proxies /auth to the shared Keycloak (sandbox realm)
    restart: unless-stopped

volumes:
  sb_pgdata:
  sb_grafana:
  sb_caddy_data:
  sb_caddy_config:

networks:
  default: {}
  v2net:
    external: true
    name: ovw2_default  # the shared Keycloak's network (same pattern as prod)
