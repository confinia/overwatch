# Overwatch login theme (#516): the sign-in, registration, reset and passkey
# pages share the app's ground, accent and type instead of stock Keycloak.
# A child of keycloak.v2 — templates, classes and the webauthn pages all come
# from the parent; this theme only adds a stylesheet. The e2e walks rely on
# id=username / id=password / id=kc-login and the reset-credentials link, and
# nothing here renames or restructures them.
parent=keycloak.v2
import=common/keycloak

# `styles` replaces the parent's list, so the parent's sheet is named again,
# then ours on top.
styles=css/styles.css css/overwatch.css
