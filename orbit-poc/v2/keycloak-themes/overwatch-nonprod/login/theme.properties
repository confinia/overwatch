# Overwatch login theme for staging and sandbox (#516): everything the
# `overwatch` theme does, plus an unmissable "not production" marker. The
# realm display names ("Overwatch STAGING", "Overwatch SANDBOX") already
# differ, but a uniformly branded page across four realms would make them the
# only signal — and nobody should type production credentials into a test
# form because the page looked right.
parent=overwatch
import=common/keycloak
styles=css/styles.css css/overwatch.css css/nonprod.css
