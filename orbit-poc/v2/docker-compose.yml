# v2 stack — ISOLATED from the free/open version (own project, DB, volumes):
#   podman-compose -p ovw2 -f docker-compose.yml up -d
# Serves behind the SAME hostname (single access point): the app caddy
# routes /auth/* here via the host port. Nothing in this stack touches the
# v1 database or Grafana.
#
# Ports (127.0.0.1): 12070 keycloak (1PESI: overwatch·prod·keycloak, #213).
#
# CRITICAL: the project name MUST be `ovw2` — the containers (ovw2_keycloak_1),
# the network (ovw2_default, which blue/green/staging/sandbox join as external),
# and the DB volume (ovw2_kc_pgdata) are all named from it. Running this WITHOUT
# `-p ovw2` (e.g. a bare `podman-compose up` from this `v2/` dir) forks a
# PARALLEL stack named `v2_*` with a FRESH empty DB on the wrong network —
# realms look wiped and every stack loses Keycloak (auth down everywhere). The
# `name:` below pins it so a bare up still lands on ovw2.
name: ovw2
services:
  kc-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
    # POSTGRES_PASSWORD via env_file — never committed.
    env_file:
      - .env
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://overwatch.confinia.io/auth
      KC_HEALTH_ENABLED: "true"
      # Explicit JVM heap (platform rule 3): KC 26 otherwise sizes from HOST RAM
      # (~1/4 of 31 GB) and then gets OOM-killed by the 2g container cap under
      # load — which looks like a crash, not a config error. 1024m heap + ~400m
      # non-heap fits under 2g. The container mem_limit is only the backstop.
      JAVA_OPTS_KC_HEAP: "-Xms512m -Xmx1024m"
    # KC_DB_PASSWORD + KC_BOOTSTRAP_ADMIN_* via .env (VM-side only).
    env_file:
      - .env
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:12070:8080"  # 1PESI: overwatch(2)·prod(0)·keycloak(7) (#213)
    depends_on:
      kc-db:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 2g
    restart: unless-stopped

  # Declarative realm config (#181): reconciles ONLY the smtpServer + verifyEmail
  # settings in ./keycloak-config/*.json into the EXISTING realms. The files carry
  # no clients/roles/scopes/flows arrays, so those are never managed or deleted —
  # partial + no-delete = safe for live prod auth. Idempotent: it re-converges on
  # every deploy, replacing the by-hand kcadm SMTP setup. Run staging-first: edit
  # a realm's file, deploy, validate, then the next realm.
  #   No config-cli build exists for KC 26.3; the 26.1 baseline is compatible for
  #   these basic realm settings and is at/below our server version (verified).
  #   Requires in .env (VM-side, never committed): KC_SMTP_PASSWORD, and the
  #   admin creds under the names the cli reads: KEYCLOAK_USER + KEYCLOAK_PASSWORD.
  keycloak-config-cli:
    image: quay.io/adorsys/keycloak-config-cli:6.5.1-26.1.0
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_URL: "http://keycloak:8080/auth"
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"
      IMPORT_FILES_LOCATIONS: "/config/*.json"
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Reconcile only the declared realm settings; never delete undeclared
      # entities (belt-and-suspenders on top of the partial files).
      IMPORT_MANAGED_CLIENT: "no-delete"
      IMPORT_MANAGED_ROLE: "no-delete"
      IMPORT_MANAGED_GROUP: "no-delete"
      IMPORT_MANAGED_CLIENT_SCOPE: "no-delete"
      IMPORT_MANAGED_REQUIRED_ACTION: "no-delete"
      IMPORT_MANAGED_IDENTITY_PROVIDER: "no-delete"
      IMPORT_MANAGED_AUTHENTICATION_FLOW: "no-delete"
      IMPORT_MANAGED_COMPONENT: "no-delete"
    env_file:
      - .env
    volumes:
      - ./keycloak-config:/config:ro
    restart: "no"

volumes:
  kc_pgdata:
